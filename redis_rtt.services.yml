services:
  # ---------------------------------------------------------------------------
  # Cache backend factory. Enable in settings.php with:
  #   $settings['cache']['default'] = 'cache.backend.redis_rtt';
  # ---------------------------------------------------------------------------
  cache.backend.redis_rtt:
    class: Drupal\redis_rtt\Cache\BatchingCacheBackendFactory
    arguments:
      - '@redis.factory'
      - '@cache_tags.invalidator.checksum'
      - '@serialization.phpserialize'

  # ---------------------------------------------------------------------------
  # Connection factory that keeps AUTH/SELECT off the per-request path.
  # Select it with $settings['redis.connection']['interface'] = 'FastPhpRedis';
  #
  # The priority is deliberately below the redis module's own 20. When no
  # interface is named, \Drupal\redis\ClientFactory takes the highest-priority
  # factory it can find, so a higher number here would mean that merely
  # installing this module swapped the client and applied this module's
  # timeouts - including a bounded read timeout, which is right for a cache read
  # and wrong for RedisQueue::claimItem()'s blocking brpoplpush(). Choosing this
  # client stays an explicit act.
  # ---------------------------------------------------------------------------
  redis_rtt.redis_factory.phpredis:
    class: Drupal\redis_rtt\Client\FastPhpRedisFactory
    tags:
      - { name: redis_client_factory, priority: 10 }

  # ---------------------------------------------------------------------------
  # Lock factory using single-round-trip Lua compare-and-swap.
  # Enable by overriding the lock services, see redis_rtt.services.example.yml.
  # ---------------------------------------------------------------------------
  redis_rtt.lock.factory:
    class: Drupal\redis_rtt\Lock\LuaLockFactory
    arguments: ['@redis.factory']

  # ---------------------------------------------------------------------------
  # Measurement. Off unless $settings['redis_rtt_report'] is TRUE.
  #
  # A middleware, at a priority that puts it outside http_middleware.page_cache
  # (200). As a response subscriber the header ended up *inside* the cached
  # response: served to later requests that never made those round trips, and
  # outliving the setting that produced it.
  # ---------------------------------------------------------------------------
  redis_rtt.round_trip_report:
    class: Drupal\redis_rtt\StackMiddleware\RoundTripReportMiddleware
    tags:
      - { name: http_middleware, priority: 1000 }

  # The stock connection with instrumentation attached, for baselines.
  redis_rtt.redis_factory.counting:
    class: Drupal\redis_rtt\Client\CountingPhpRedisFactory
    tags:
      - { name: redis_client_factory, priority: -10 }
